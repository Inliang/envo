<?xml version="1.0" encoding="UTF-8"?>
<!--
  ============================================================================
  Envo 信封打印助手 · 图标母版 favicon.svg
  ============================================================================
  画布   : viewBox 0 0 32 32，width/height = 32
  品牌色 : teal #0D9488 (brand-600)  点缀色 : orange #F97316 (cta-500)
  结构   : 三层 —— ① 圆角矩形底  ② 信封图形（白色主体 + teal V 形封口）  ③ 内部细节

  ★ 关键：本文件【不含任何 <text> 元素】，全部为纯矢量几何图形。
    原因：转 PNG/ICO 时（尤其是 CI / headless 环境）字体缺失会把 <text>
    渲染成方块（豆腐块）。纯路径方案零字体依赖，任何环境都能正确栅格化。
    后续维护时【不要往里加 <text>】。

  ===========================================================================
  派生各尺寸时的注意事项
  ===========================================================================
  【favicon.ico — 需内嵌 16 / 32 / 48 三帧】
    · 32 帧：直接用本母版，保留三层（含内部细节）。
    · 48 帧：同 32 帧，细节同样保留；48px 下细节清晰。
    · 16 帧：★ 必须【单独重绘】，不要直接缩放 32 帧。
             缩放后 1.6px 的地址线会糊成灰块，4.5px 的橙色邮票会变成脏点。
             16px 帧只保留两层：圆角矩形底 + 白色信封（含 V 形封口），
             【删除 id="detail" 整个分组】。
             另外 16px 下把圆角从 rx=7 收到 rx=6，避免小尺寸下显得过圆。
      推荐工具：ImageMagick
        magick favicon.svg -resize 32x32 -background none 32.png
        magick favicon.svg -resize 48x48 -background none 48.png
        # 16 帧：先手工删掉 <g id="detail">…</g> 存为 favicon-16.svg 再转
        magick favicon-16.svg -resize 16x16 -background none 16.png
        magick 16.png 32.png 48.png favicon.ico
      ⚠️ 部分老版 ImageMagick 转 ICO 需要先把 PNG 转成 32bit BGRA，
         若报 "no encode delegate"，改用 `magick ... -define icon:auto-resize=16,32,48 favicon.ico`

  【PNG — 180 / 192 / 512】
    · 180×180（apple-touch-icon）：★ 必须【实底不透明】，不要带透明区域。
      iOS 会为透明像素填黑底，透明边缘会出现黑边。
      本母版底层是覆盖满画布的圆角矩形，四角是透明的 ——
      导出 180×180 时请【补一层同尺寸的 #0D9488 实心方形垫底】，
      或把圆角矩形的 rx 设为 0（iOS 自己会加圆角遮罩，母版不需要圆角）。
    · 192×192 / 512×512（webmanifest）：可保留圆角与透明，直接等比导出。
    · 512 下建议把 rx 从 7 按比例放大到 112（7/32 = 21.9%），
      直接缩放即可，无需手改。

  【safari-pinned-tab.svg（可选 P2）】
    · Safari 固定标签要求【纯黑、单色、无 fill 外的颜色】。
      派生方式：把本文件所有 fill 改为 #000000，删除橙色邮票，
      viewBox 保持 0 0 32 32，删除 width/height 或用 16。

  ===========================================================================
  栅格化自检清单
  ===========================================================================
  [ ] 16px 下仍能认出是信封（V 形封口是关键识别点，不能省）
  [ ] 16px 下没有橙色脏点（detail 组必须已删除）
  [ ] 所有导出的 PNG 均无字体依赖报错（本母版无 <text>，不应有此问题）
  [ ] 180×180 无透明区域（否则 iOS 主屏幕出黑块）
  ============================================================================
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="32" height="32"
     viewBox="0 0 32 32"
     shape-rendering="geometricPrecision"
     role="img" aria-labelledby="favicon-title">
  <title id="favicon-title">Envo 信封打印助手</title>

  <!-- ① 圆角矩形底：rx=7 ≈ 边长 22%，与页头 logo 的 rounded-xl 视觉一致 -->
  <rect x="0" y="0" width="32" height="32" rx="7" ry="7" fill="#0D9488" />

  <!-- ② 信封图形：白色主体（x 5–27, y 8.5–23.5，上下留白各 8.5，视觉居中） -->
  <rect x="5" y="8.5" width="22" height="15" rx="1.5" ry="1.5" fill="#FFFFFF" />

  <!-- ② 信封图形：teal V 形封口。三角形顶点落在信封高度的 51% 处，
       把白色主体"咬"出一个 V 口 —— 这是小尺寸下唯一能被认出的信封特征。
       三角形与底色同色，超出白色主体的部分画上去也是 teal-on-teal，不可见。 -->
  <path d="M5.6 9.2 L16 16.2 L26.4 9.2 Z" fill="#0D9488" />

  <!-- ③ 内部细节：仅在 ≥32px 时保留。导出 16px 帧前【删除整个 <g id="detail">】 -->
  <g id="detail">
    <!-- 收件人地址示意线（两条，teal #0D9488，白底上 5.47:1） -->
    <rect x="7.5" y="18.2" width="9"   height="1.6" rx="0.8" ry="0.8" fill="#0D9488" />
    <rect x="7.5" y="20.8" width="6"   height="1.6" rx="0.8" ry="0.8" fill="#0D9488" />
    <!-- 右上角邮票位（cta-500 橙，仅 ≥32px 使用，16px 必须删除） -->
    <rect x="21"  y="18"   width="4.5" height="4.5" rx="0.5" ry="0.5" fill="#F97316" />
  </g>
</svg>
